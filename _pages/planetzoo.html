  <div class="modal fade" id="planetzooLightbox" tabindex="-1" aria-labelledby="planetzooLightboxLabel" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen-sm-down modal-xl modal-dialog-centered">
      <div class="modal-content bg-transparent border-0">
        <div class="modal-header border-0">
          <h5 class="modal-title text-white" id="planetzooLightboxLabel"></h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-0 position-relative">
          <img src="" class="img-fluid w-100 planetzoo-lightbox-image" alt="">
          <button type="button" class="planetzoo-lightbox-nav planetzoo-lightbox-prev" aria-label="Previous image">
            <i class="fas fa-chevron-left"></i>
          </button>
          <button type="button" class="planetzoo-lightbox-nav planetzoo-lightbox-next" aria-label="Next image">
            <i class="fas fa-chevron-right"></i>
          </button>
          <p class="planetzoo-lightbox-caption"></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var currentGallery = [];
      var currentIndex = 0;
      var modal = document.getElementById('planetzooLightbox');
      var modalLabel = modal.querySelector('.modal-title');
      var modalImage = modal.querySelector('.planetzoo-lightbox-image');
      var modalCaption = modal.querySelector('.planetzoo-lightbox-caption');
      var prevButton = modal.querySelector('.planetzoo-lightbox-prev');
      var nextButton = modal.querySelector('.planetzoo-lightbox-next');

      function updateLightbox(index) {
        currentIndex = index;
        var thumb = currentGallery[currentIndex];
        var img = thumb.getAttribute('data-img');
        var title = thumb.getAttribute('data-title');
        var caption = thumb.getAttribute('data-caption');

        modalLabel.textContent = title;
        modalImage.src = img;
        modalImage.alt = title;

        if (!caption || caption.trim() === '' || caption.trim() === title.trim()) {
          modalCaption.style.display = 'none';
          modalCaption.textContent = '';
        } else {
          modalCaption.style.display = 'block';
          modalCaption.textContent = caption;
        }

        prevButton.style.display = currentGallery.length > 1 ? 'flex' : 'none';
        nextButton.style.display = currentGallery.length > 1 ? 'flex' : 'none';
      }

      document.querySelectorAll('.planetzoo-thumb').forEach(function (thumb) {
        thumb.addEventListener('click', function (event) {
          event.preventDefault();
          var gallery = thumb.closest('.planetzoo-gallery');
          currentGallery = Array.from(gallery.querySelectorAll('.planetzoo-thumb'));
          currentIndex = currentGallery.indexOf(thumb);
          updateLightbox(currentIndex);
        });
      });

      prevButton.addEventListener('click', function () {
        if (currentGallery.length > 1) {
          updateLightbox((currentIndex - 1 + currentGallery.length) % currentGallery.length);
        }
      });

      nextButton.addEventListener('click', function () {
        if (currentGallery.length > 1) {
          updateLightbox((currentIndex + 1) % currentGallery.length);
        }
      });
    })();
  </script>
