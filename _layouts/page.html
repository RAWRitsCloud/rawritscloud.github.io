---
layout: default
---

<div class="rawr-container">
  <div class="article-layout">

    <div class="article-main">
      <header class="page-header" style="padding-top:2rem;">
        <h1>{{ page.title }}</h1>
        {% if page.description %}
        <p>{{ page.description }}</p>
        {% endif %}
      </header>

      <div class="article-body">
        {{ content }}
      </div>

      {% if page.comments == true %}
      <div id="comments" style="margin-top:3rem;">
        {% include disqus.html %}
      </div>
      {% endif %}
    </div>

    <aside class="article-sidebar">
    </aside>

  </div>
</div>
